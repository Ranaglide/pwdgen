<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranaglide password generator</title>
    <link rel="shortcut icon" href="img/layout/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/settings.js" defer></script>
    <script src="js/search.js" defer></script>
</head>

<body>
    <header>
        <div class="container">
            <div class="header__wrapper wrapper">
                <a href="" class="logo" id="logo-desktop"><img src="img/layout/logo-desktop.svg" alt=""></a>
                <a href="" class="logo" id="logo-mobile"><img src="img/layout/logo-mobile.svg" alt=""></a>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="main__wrapper wrapper">
                <div class="panel">
                    <h2>Tracks</h2>
                    <form>
                        <div class="search">
                            <input placeholder="tracks to find" type="text" id="search-input">
                            <button id="find"></button>
                        </div>
                    </form>
                    <div class="search__results">
                        
                    </div>
                </div>
                <div class="panel">
                    <h2>Passwords</h2>
                    <div class="passwords__list">
                        <div class="password__item">
                            <h3>google.com</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="footer__wrapper wrapper">

            </div>
        </div>
    </footer>
</body>

</html>
